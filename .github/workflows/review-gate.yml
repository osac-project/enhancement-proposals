---
name: review-gate

# Fail required check while a human reviewer still has CHANGES_REQUESTED.
permissions:
  pull-requests: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  pull_request_review:
    types: [submitted, dismissed]

jobs:
  check-human-reviews:
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check for human changes requested
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          reviews=$(gh api --paginate --slurp "repos/${REPO}/pulls/${PR}/reviews" | jq '
            def valid_review:
              type == "object"
              and has("user")
              and (.id | type == "number" and . > 0 and . == floor)
              and (.state | IN("APPROVED", "CHANGES_REQUESTED", "DISMISSED", "COMMENTED", "PENDING"))
              and (if (.state | IN("APPROVED", "CHANGES_REQUESTED", "DISMISSED")) then
                (.submitted_at | . as $timestamp |
                  try (fromdateiso8601 | todateiso8601 == $timestamp) catch false)
              else
                (.submitted_at == null or (.submitted_at | type == "string"))
              end)
              and (.user == null or (.user |
                type == "object"
                and (.login | type == "string" and length > 0)
                and (.type == null or (.type | type == "string"))
              ));
            if type == "array" and all(.[]; type == "array" and all(.[]; valid_review))
            then add // [] else error("Invalid review response") end
          ')
          set +e
          jq -e '
            [.[]
              | select(.user != null)
              | select(((.user.login // "") | endswith("[bot]")) | not)
              | select((.user.type // "User") != "Bot")
              | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")
            ]
            | group_by(.user.login)
            | map(max_by([(.submitted_at // ""), (.id // 0)]))
            | map(select(.state == "CHANGES_REQUESTED"))
            | length > 0
          ' <<<"${reviews}" >/dev/null
          rc=$?
          set -e
          if [[ ${rc} -eq 0 ]]; then
            echo "::error::Human reviewer still has CHANGES_REQUESTED"
            exit 1
          elif [[ ${rc} -ne 1 ]]; then
            echo "::error::Cannot evaluate human review state (jq rc=${rc})"
            exit 1
          fi
          echo "No outstanding human changes requested"

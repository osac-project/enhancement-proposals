name: Test Plan Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - '**/TestPlan.md'
      - '**/testplan.md'

  issue_comment:
    types: [created]

permissions: {}

jobs:
  resolve-pr:
    if: >-
      github.event_name == 'pull_request_target'
      || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && (contains(github.event.comment.body, '/test-plan-score')
              || contains(github.event.comment.body, '/test-plan-respond'))
          && contains(fromJSON('["MEMBER","COLLABORATOR","OWNER"]'),
                      github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      head_repo: ${{ steps.resolve.outputs.head_repo }}
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
      - name: Validate slash command
        if: github.event_name == 'issue_comment'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if echo "$COMMENT_BODY" | grep -qP '(?m)^\s*/test-plan-(score|respond)'; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Slash command not found as line-starting command"
            exit 1
          fi

      - name: Acknowledge comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content=eyes --silent

      - name: Resolve PR context
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request_target" ]]; then
            echo "pr_number=$EVENT_PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "head_sha=$EVENT_PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "head_repo=$EVENT_PR_HEAD_REPO" >> "$GITHUB_OUTPUT"
            echo "mode=score" >> "$GITHUB_OUTPUT"

          elif [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            PR_JSON=$(gh api "repos/${{ github.repository }}/pulls/$EVENT_ISSUE_NUMBER" \
              --jq '{head_sha: .head.sha, head_repo: .head.repo.full_name}')
            echo "pr_number=$EVENT_ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(echo "$PR_JSON" | jq -r .head_sha)" >> "$GITHUB_OUTPUT"
            echo "head_repo=$(echo "$PR_JSON" | jq -r .head_repo)" >> "$GITHUB_OUTPUT"

            if echo "$COMMENT_BODY" | grep -q '/test-plan-respond'; then
              echo "mode=respond" >> "$GITHUB_OUTPUT"
            else
              echo "mode=score" >> "$GITHUB_OUTPUT"
            fi
          fi

  review:
    needs: resolve-pr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: tp-review-${{ needs.resolve-pr.outputs.pr_number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout OSAC AI skills
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: osac-project/osac-ai-skills
          token: ${{ secrets.OSAC_AI_SKILLS_READ_TOKEN }}
          path: osac-ai-skills
          persist-credentials: false

      - name: Verify skills checkout
        run: |
          set -euo pipefail
          skills_path="$GITHUB_WORKSPACE/osac-ai-skills"
          skills_sha="$(git -C "$skills_path" rev-parse --verify "HEAD^{commit}")"
          if ! [[ "$skills_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::osac-ai-skills resolved to an invalid commit SHA: $skills_sha"
            exit 1
          fi
          echo "Resolved osac-ai-skills commit: ${skills_sha}"
          {
            echo "### OSAC AI skills"
            echo
            echo "Resolved osac-ai-skills commit: ${skills_sha}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Authenticate to GCP with Workload Identity Federation
        id: gcp-wif
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          project_id: ${{ secrets.GCP_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: false

      - name: Set up GCP service account key fallback
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER == ''
        run: |
          umask 077
          echo "$GCP_SA_KEY" | base64 -d > /tmp/gcp-sa-key.json
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Run test plan review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-wif.outputs.credentials_file_path || '/tmp/gcp-sa-key.json' }}
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ secrets.GCP_PROJECT }}
          CLOUD_ML_REGION: ${{ secrets.GCP_REGION }}
          TP_REVIEW_MODEL: ${{ vars.TP_REVIEW_MODEL || 'claude-opus-4-6' }}
          TP_SHADOW: ${{ vars.TP_SHADOW || 'true' }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
          PR_HEAD_SHA: ${{ needs.resolve-pr.outputs.head_sha }}
          MODE: ${{ needs.resolve-pr.outputs.mode }}
          TP_REVIEW_SKILLS_PATH: ${{ github.workspace }}/osac-ai-skills
        run: python .github/scripts/tp_review.py

      - name: Upload TestPlan response for fork PR
        id: upload-fork-response
        if: >-
          needs.resolve-pr.outputs.mode == 'respond'
          && needs.resolve-pr.outputs.head_repo != github.repository
          && (vars.TP_SHADOW || 'true') == 'false'
          && hashFiles('workdir-test-plan-review/testplan-output.md') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4
        with:
          name: test-plan-response-pr${{ needs.resolve-pr.outputs.pr_number }}-run${{ github.run_id }}
          path: workdir-test-plan-review/testplan-output.md
          retention-days: 7

      - name: Link fork response on the PR
        if: steps.upload-fork-response.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
          ARTIFACT_URL: ${{ steps.upload-fork-response.outputs.artifact-url }}
        run: |
          cat > /tmp/test-plan-response-comment.md <<EOF
          The revised TestPlan is ready. This PR comes from a fork, so the workflow cannot push the change to its branch.

          [Download the revised TestPlan.md](${ARTIFACT_URL})
          EOF
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/test-plan-response-comment.md
          rm -f /tmp/test-plan-response-comment.md

      - name: Remove GCP credentials
        if: always()
        env:
          GCP_WIF_CREDENTIALS: ${{ steps.gcp-wif.outputs.credentials_file_path }}
        run: |
          rm -f /tmp/gcp-sa-key.json
          if [[ -n "$GCP_WIF_CREDENTIALS" ]]; then
            rm -f -- "$GCP_WIF_CREDENTIALS"
          fi

---
name: ep-jira-type

# Required check: ep-jira-type.
#
# Every enhancement directory new to the pull request must reference a Jira
# issue of type Feature (see CONTRIBUTING.md). Runs on pull_request_target
# because the Jira credential has to be available for pull requests opened
# from forks: that trigger never exposes the checked-out pull request to
# this job — the base branch is checked out and the changed file names come
# from the API, so no pull request code runs with the credential in scope.
#
# The conclusion is posted as a check run on the pull request head commit.
# Actions' own check suite for a pull_request_target run attaches to the
# base branch, so the explicit check run is what merge rules can require.
#
# Infrastructural failures (missing credential, Jira unreachable, unusable
# base references) post a neutral conclusion rather than failing: a
# contributor cannot fix those, so they must not block the merge the way an
# unresolvable reference fails closed in check_ep_naming.py.
#
# Known limitation: a check run is keyed by (head commit, name), so two pull
# requests that share a head commit but target different bases can overwrite
# each other's verdict. Only a base whose ruleset requires ep-jira-type is
# affected, and today that is main alone; revisit with per-branch check
# names if another base ever requires this check.

on:  # yamllint disable-line rule:truthy
  pull_request_target:
    # edited is needed for base-branch retargets: a directory grandfathered
    # against the old base can be new against the new one, and the head
    # commit does not change, so no other event would re-check it.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  ep-jira-type:
    name: ep-jira-type
    # Title and body edits keep the previous verdict; only a base change
    # can change the answer.
    if: >-
      github.event.action != 'edited'
      || github.event.changes.base != null
    # Job-level so a skipped title edit never cancels a running check.
    concurrency:
      group: ep-jira-type-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Check Jira issue type
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LIVE_BASE_REF: origin/${{ github.event.pull_request.base.ref }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          set -uo pipefail
          verdict='{"state":"neutral","description":"check did not run; see logs"}'
          if out=$(python3 .github/scripts/ep_jira_type.py); then
            verdict="$out"
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Post check run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERDICT: ${{ steps.check.outputs.verdict }}
          FALLBACK: '{"state":"neutral","description":"check did not run; see logs"}'
        run: |
          set -uo pipefail
          payload="${VERDICT:-$FALLBACK}"
          conclusion=$(jq -r '.state' <<<"$payload" 2>/dev/null || true)
          description=$(jq -r '.description' <<<"$payload" 2>/dev/null || true)
          case "${conclusion:-}" in
            success|failure|neutral) ;;
            *)
              conclusion=neutral
              description="check did not run; see logs"
              ;;
          esac
          body=$(jq -n \
            --arg sha "$HEAD_SHA" \
            --arg conclusion "$conclusion" \
            --arg summary "${description:-check did not run}" \
            '{
              name: "ep-jira-type",
              head_sha: $sha,
              status: "completed",
              conclusion: $conclusion,
              output: {title: "Jira Feature type", summary: $summary}
            }')
          gh api -X POST "repos/${REPO}/check-runs" --input - <<<"$body"

name: EP Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - '**/prd.md'
      - '**/design.md'
      - '**/DESIGN.md'
      - '**/Design.md'
      - 'enhancements/**/README.md'

  issue_comment:
    types: [created]

jobs:
  resolve-pr:
    if: >-
      (github.event_name == 'pull_request_target'
       && github.event.pull_request.user.login != 'forgeSmith-bot')
      || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && contains(github.event.comment.body, '/review-ep')
          && contains(fromJSON('["MEMBER","COLLABORATOR","OWNER"]'),
                      github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_ref: ${{ steps.resolve.outputs.base_ref }}
    steps:
      - name: Validate slash command
        if: github.event_name == 'issue_comment'
        id: validate
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if echo "$COMMENT_BODY" | grep -qP '(?m)^\s*/review-ep'; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Comment contains '/review-ep' but not as a line-starting command"
            exit 1
          fi

      - name: Acknowledge comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content=eyes --silent

      - name: Resolve PR context
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request_target" ]]; then
            echo "pr_number=$EVENT_PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "head_sha=$EVENT_PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "base_ref=$EVENT_PR_BASE_REF" >> "$GITHUB_OUTPUT"

          elif [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            PR_JSON=$(gh pr view "$EVENT_ISSUE_NUMBER" --repo "${{ github.repository }}" --json headRefOid,baseRefName)
            echo "pr_number=$EVENT_ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(echo "$PR_JSON" | jq -r .headRefOid)" >> "$GITHUB_OUTPUT"
            echo "base_ref=$(echo "$PR_JSON" | jq -r .baseRefName)" >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: resolve-pr
    runs-on: ubuntu-latest
    concurrency:
      group: ep-review-${{ needs.resolve-pr.outputs.pr_number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve-pr.outputs.base_ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Clone skills
        env:
          OSAC_AI_SKILLS_READ_TOKEN: ${{ secrets.OSAC_AI_SKILLS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${OSAC_AI_SKILLS_READ_TOKEN:-}" ]]; then
            echo "::error::Configure OSAC_AI_SKILLS_READ_TOKEN with read access to osac-project/osac-ai-skills"
            exit 1
          fi
          skills_auth="$(printf 'x-access-token:%s' "$OSAC_AI_SKILLS_READ_TOKEN" | base64 --wrap=0)"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/osac-project/osac-ai-skills/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${skills_auth}" \
            git clone --depth 1 https://github.com/osac-project/osac-ai-skills /opt/skills
          unset skills_auth OSAC_AI_SKILLS_READ_TOKEN
          skills_sha="$(git -C /opt/skills rev-parse --verify "HEAD^{commit}")"
          if ! [[ "$skills_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::osac-ai-skills resolved to an invalid commit SHA: $skills_sha"
            exit 1
          fi
          echo "Resolved osac-ai-skills commit: ${skills_sha}"
          {
            echo "### OSAC AI skills"
            echo
            echo "Resolved osac-ai-skills commit: ${skills_sha}"
          } >> "$GITHUB_STEP_SUMMARY"
          for s in prd-review design-review; do
            if [[ ! -f "/opt/skills/skills/$s/SKILL.md" ]]; then
              echo "::error::skills/$s/SKILL.md missing from osac-ai-skills"
              exit 1
            fi
          done

      - name: Stage canonical OSAC context for skill lookups
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          osac_sha="$(gh api repos/osac-project/osac/commits/main --jq '.sha')"
          echo "Resolved OSAC context commit: $osac_sha"
          echo "OSAC review context commit: $osac_sha" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p /opt/skills/reference/agent-context
          # Fetch full documents at one commit; any failed or empty download
          # stops the job before either review workspace is created.
          for doc in \
            agent-context/{enclave-wizard-pipeline,networking-decisions,osac-dimensions,review-patterns} \
            ARCHITECTURE CONVENTIONS personas INTEGRATION-TESTING; do
            gh api "repos/osac-project/osac/contents/docs/${doc}.md?ref=${osac_sha}" \
              -H 'Accept: application/vnd.github.raw+json' > "/opt/skills/reference/${doc}.md"
            test -s "/opt/skills/reference/${doc}.md"
          done
          echo "$osac_sha" > /opt/skills/reference/osac-context-sha.txt

      - name: Stage enhancement-proposals content for skill lookups
        # Reuses the repo already checked out by the first step above (at
        # base_ref) instead of a second, independent clone of a mutable ref.
        # guidelines/ is the canonical PRD/design template + guide source
        # skills/prd-review and skills/design-review resolve against.
        # enhancements/ is design-review's calibration reference library
        # (see review-patterns.md's "EP Reference Library"). ep_review.py
        # excludes the current PR's own enhancement directory from this
        # copy before running the skill, so a design/PRD update never sees
        # its own stale pre-PR version staged as a "reference" example.
        run: |
          mkdir -p /opt/skills/enhancement-proposals
          cp -r guidelines /opt/skills/enhancement-proposals/
          cp -r enhancements /opt/skills/enhancement-proposals/

      - name: Set up GCP credentials
        run: echo "$GCP_SA_KEY" | base64 -d > /tmp/gcp-sa-key.json
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Run EP review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-sa-key.json
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ secrets.GCP_PROJECT }}
          CLOUD_ML_REGION: ${{ secrets.GCP_REGION }}
          EP_REVIEW_SHADOW: ${{ vars.EP_REVIEW_SHADOW || 'true' }}
          EP_REVIEW_SKIP_LOGISTICS: ${{ vars.EP_REVIEW_SKIP_LOGISTICS || 'false' }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
          PR_HEAD_SHA: ${{ needs.resolve-pr.outputs.head_sha }}
        run: python .github/scripts/ep_review.py

      - name: Upload OTEL metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4
        with:
          name: ep-review-otel-pr${{ needs.resolve-pr.outputs.pr_number }}-run${{ github.run_id }}
          path: workdir-*/_run/claude-otel.jsonl
          retention-days: 90
          if-no-files-found: ignore
